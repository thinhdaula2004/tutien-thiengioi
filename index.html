<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Truyện Và Tu Luyện</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #24104d 0%, #090d1a 45%, #03050b 100%);
    }

    header {
      padding: 28px 18px;
      text-align: center;
      border-bottom: 1px solid #6939a8;
      background: rgba(5, 8, 20, 0.8);
    }

    h1 {
      margin: 0;
      color: #bda1ff;
      font-size: 30px;
      text-shadow: 0 0 15px #713cff;
    }

    .subtitle {
      margin-top: 8px;
      color: #9ca9c9;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 25px 16px;
    }

    .card {
      margin-bottom: 18px;
      padding: 20px;
      border: 1px solid #41306b;
      border-radius: 16px;
      background: rgba(15, 20, 42, 0.9);
      box-shadow: 0 0 20px rgba(104, 57, 190, 0.15);
    }

    .card h2 {
      margin-top: 0;
      color: #8edcff;
    }

    .realm {
      color: #c4a7ff;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(90deg, #4338ca, #7c3aed);
    }
  </style>
</head>

<body>

  <header>
    <h1>⚔ Truyện Và Tu Luyện ⚔</h1>
    <div class="subtitle">
Nhất niệm phàm trần · Nhất niệm thành tiên
</div>
</header>

<main>
  <div class="card" id="loginBox">
  <h2>🔐 Đăng Nhập</h2>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Mật khẩu"
  >

  <button id="loginBtn">Đăng nhập</button>

  <p id="loginMessage"></p>
  </div>

  <div class="card">
    <h2>📖 Tàng Kinh Các</h2>
    <p>Đọc truyện và khám phá thế giới tu tiên.</p>
    <button>Vào đọc truyện</button>
  </div>

  <div class="card">
    <h2>☯ Tu Luyện</h2>
    <p>Cảnh giới hiện tại:</p>
    <div class="realm">Phàm Nhân · Nhất Trọng</div>
    <button>Bắt đầu tu luyện</button>
  </div>

  <div class="card">
    <h2>💎 Túi Đồ</h2>
    <p>Linh thạch: <strong>0</strong></p>
    <p>Công pháp: Chưa sở hữu</p>
  </div>

</main>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://kvytwomshqmevnslawgs.supabase.co";
  const SUPABASE_KEY = "sb_publishable_2uKxl3flxvnv9lVS2QIIKA__3u1P-RG";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  ); 
  const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");

loginBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    loginMessage.textContent = "⚠️ Hãy nhập email và mật khẩu.";
    return;
  }

  loginMessage.textContent = "Đang đăng nhập...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    loginMessage.textContent = "❌ Đăng nhập thất bại: " + error.message;
    return;
  }

  loginMessage.textContent = "✅ Đăng nhập thành công!";
  console.log("User:", data.user);
});
</script>

</body>
</html>
